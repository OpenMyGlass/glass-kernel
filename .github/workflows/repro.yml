name: repro
on:
  workflow_dispatch:
  pull_request:
    paths: [scripts/build.sh, scripts/source.env, scripts/variant.sh, scripts/fetch-source.sh, scripts/fetch-pvr.sh, scripts/check-reproducible.sh, Dockerfile, .github/workflows/repro.yml, "patches/**", "configs/**"]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        variant: [stock, tuned, tuned-stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          VARIANT: ${{ matrix.variant }}
        run: |
          scripts/fetch-pvr.sh
          docker build --platform linux/amd64 -t glass-kernel-build .
          docker run --rm --platform linux/amd64 -e VARIANT -v "$PWD:/work" -v glass-kernel-src:/work/src glass-kernel-build \
            sh -c 'scripts/fetch-source.sh && scripts/check-reproducible.sh'
