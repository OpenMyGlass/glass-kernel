name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/build-in-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/zImage
            out/config
            out/SHA256SUMS
